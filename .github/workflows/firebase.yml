# Checks the Firestore security rules, then uploads them to your Firebase project.
# Vercel deploys the app by itself on every push to main (same set-up as Veyra).
#
# Runs on every push to main, on pull requests, and on demand:
# GitHub → Actions → "Firebase rules" → Run workflow.
#
# The upload needs (docs/DEPLOY.md, step 6):
#   - secret   FIREBASE_SERVICE_ACCOUNT  (JSON key of a service account)
#   - variable FIREBASE_PROJECT_ID       (e.g. tumbuh-1a2b3)
# Without them the upload is skipped and only the rule tests run.
name: Firebase rules

on:
  push:
    branches: [main]
    paths: ['firebase/**', 'firebase.json', '.github/workflows/firebase.yml']
  pull_request:
    paths: ['firebase/**', 'firebase.json']
  workflow_dispatch:

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rules:
    name: 1 · Security rules (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --prefix firebase/tests --no-audit --no-fund
      - name: Only you can read or change your data
        run: npm --prefix firebase/tests test

  deploy:
    name: 2 · Upload rules to Firebase
    needs: rules
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Are the deploy key and project set?
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -n "$KEY" ] && [ -n "$PROJECT" ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT secret or FIREBASE_PROJECT_ID variable is not set, so the rules were not uploaded. See docs/DEPLOY.md, step 6."
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.present == 'true'
        with:
          node-version: 22
      - if: steps.key.outputs.present == 'true'
        run: npm install --prefix firebase/tests --no-audit --no-fund
      - uses: google-github-actions/auth@v3
        if: steps.key.outputs.present == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules
        if: steps.key.outputs.present == 'true'
        env:
          PROJECT: ${{ vars.FIREBASE_PROJECT_ID }}
        run: npx --prefix firebase/tests firebase deploy --only firestore:rules --project "$PROJECT" --force --non-interactive
