<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Tumbuh</title>
    <meta name="description" content="Pantau tumbuh gigi anak, belajar jaga gigi, dan kenal masalah biasa." />

    <!-- Install as an app (Tumbuh on the home screen). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B0A1A" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tumbuh" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="Tumbuh" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #0b0a1a;
      }
      body {
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: manipulation;
      }
      [role='button'],
      [role='tab'],
      [role='radio'],
      [role='checkbox'],
      button {
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: manipulation;
      }
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        height: var(--app-h, 100%);
        flex: 1;
      }
    </style>
    <style id="tumbuh-fit">
      html,
      body,
      #root {
        height: var(--app-h, 100%) !important;
      }
      #root {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
      }
    </style>
    <script>
      // On an iPhone home-screen app with the see-through status bar, iOS reports the
      // page as shorter than the screen (it leaves out the status bar), even though the
      // page starts at the very top. That left a strip at the bottom and cut the tab bar
      // off. So, there, size the app to the real screen height: as a CSS variable and
      // directly on the page and #root, so no other style can undo it.
      (function () {
        function fit() {
          var nav = window.navigator;
          var h = Math.max(window.innerHeight, document.documentElement.clientHeight || 0);
          var ios = /iPhone|iPad|iPod/.test(nav.userAgent);
          var standalone = nav.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
          if (ios && standalone) {
            var portrait = window.innerHeight >= window.innerWidth;
            var full = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
            if (full > h && full - h < 140) h = full;
          }
          var px = h + 'px';
          var de = document.documentElement;
          de.style.setProperty('--app-h', px);
          de.style.setProperty('height', px, 'important');
          if (document.body) document.body.style.setProperty('height', px, 'important');
          var root = document.getElementById('root');
          if (root) root.style.setProperty('height', px, 'important');
        }
        fit();
        document.addEventListener('DOMContentLoaded', fit);
        window.addEventListener('load', fit);
        window.addEventListener('resize', fit);
        window.addEventListener('orientationchange', function () {
          setTimeout(fit, 300);
        });
        // iOS sometimes settles the size a moment after opening.
        setTimeout(fit, 500);
        setTimeout(fit, 1500);
      })();
    </script>

    <!-- Offline start-up (public/sw.js). -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>

  <body>
    <noscript>Tumbuh perlukan JavaScript. Tumbuh needs JavaScript turned on.</noscript>
    <div id="root"></div>
  </body>
</html>
